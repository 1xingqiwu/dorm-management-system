# Codespaces 演示环境：MySQL + Redis + 应用容器
# 说明：这里的密码/密钥仅用于 Codespaces 里这个一次性演示数据库，不涉及任何真实第三方密钥
services:
  # 开发容器本身（Java 17 + Node 由 devcontainer.json 的 features 安装）
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      # 覆盖 application.yaml 的本地开发配置，指向容器内的 MySQL / Redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qm_sjk?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 演示用 JWT 密钥与 AI Key 占位值，保证应用能启动
      JWT_SECRET: DormSystem-Codespaces-Demo-Secret-2026-Keep-It-Long-Enough
      AI_DEEPSEEK_API_KEY: demo-not-configured

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: qm_sjk
    volumes:
      # 首次启动时自动导入数据库结构与种子数据
      - ../qimo_sjk.sql:/docker-entrypoint-initdb.d/01-qimo_sjk.sql:ro
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
